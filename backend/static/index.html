<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinancAI.lly</title>
    <link rel="icon" type="image/png" href="/logo.png" id="tab-favicon" />
    <script type="module" crossorigin src="/assets/index-CTNF2YGd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CcQC-tS2.css">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased">
    <div id="root"></div>

    <!-- Auto-trims empty transparent margins so the logo fills the 16x16 tab icon -->
    <script>
      const img = new Image();
      img.src = '/logo.png';
      img.onload = () => {
        const temp = document.createElement('canvas');
        temp.width = img.width;
        temp.height = img.height;
        const tCtx = temp.getContext('2d');
        tCtx.drawImage(img, 0, 0);

        const { data, width, height } = tCtx.getImageData(0, 0, temp.width, temp.height);
        let minX = width, minY = height, maxX = 0, maxY = 0;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const alpha = data[(y * width + x) * 4 + 3];
            if (alpha > 10) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        if (cropW > 0 && cropH > 0) {
          const size = 64;
          const out = document.createElement('canvas');
          out.width = size;
          out.height = size;
          const oCtx = out.getContext('2d');

          const scale = Math.min(size / cropW, size / cropH);
          const drawW = cropW * scale;
          const drawH = cropH * scale;
          const offsetX = (size - drawW) / 2;
          const offsetY = (size - drawH) / 2;

          oCtx.drawImage(temp, minX, minY, cropW, cropH, offsetX, offsetY, drawW, drawH);
          document.getElementById('tab-favicon').href = out.toDataURL('image/png');
        }
      };
    </script>

  </body>
</html>
